<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Satsuma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@1,900&amp;family=Source+Sans+3:wght@400;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <section id="home" class="screen" hidden>
    <header>
      <h1>Satsuma</h1>
      <p class="sub">Photos, peeled by color.</p>
    </header>
    <div class="listhead">
      <span id="albumCount"></span>
      <div class="views">
        <div class="seg" id="viewSeg" role="group" aria-label="Album layout">
          <button type="button" data-view="list">List</button><button type="button" data-view="grid">Grid</button>
        </div>
        <button class="picbtn" id="compactTog" type="button" aria-pressed="true" aria-label="Show photo previews" title="Photo previews"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="15.5" cy="9.5" r="1.4"/></svg></button>
      </div>
    </div>
    <div id="albumList" class="albums"></div>
    <div><button id="newAlbum" class="btn" type="button">New album</button></div>
    <div class="opt"><span class="lab">Look</span>
      <div class="seg" id="lookSeg"><button type="button" data-look="light">Light</button><button type="button" data-look="dark">Dark</button></div>
    </div>
    <footer class="homefoot"><p id="storeNote"></p><p><a id="tipLink" target="_blank" rel="noopener" hidden>Tip jar</a></p></footer>
  </section>

  <section id="album" class="screen" hidden>
    <header class="bar">
      <button class="icon" id="back" type="button" aria-label="All albums"><svg viewBox="0 0 24 24"><path d="M20 12H5M11 5l-7 7 7 7"/></svg></button>
      <h2 id="albumName"></h2>
      <button class="icon" id="more" type="button" aria-label="Album menu" aria-haspopup="true"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button>
    </header>
    <div class="strip"><div class="rings" id="swatches" role="group" aria-label="Colors"></div><button class="plus" id="addColor" type="button" aria-pressed="false" aria-label="Add a second color" hidden>+ color</button></div>
    <div class="status">
      <div class="count"><i id="countDot" hidden></i><i id="countDot2" hidden></i><span id="count"></span></div>
      <div class="seg" id="order" hidden>
        <button type="button" data-order="date" aria-label="Sort by date">Date</button><button type="button" data-order="best" aria-label="Best match first">Best</button><button type="button" data-order="most" aria-label="Most color first">Most</button>
      </div>
    </div>
    <div class="progress" id="progress" hidden><i></i></div>
    <main id="grid"></main>
    <div id="selbar" hidden>
      <div class="selrow"><b id="selCount"></b><span><button class="lnk" id="selAll" type="button">Select all</button><button class="lnk" id="selDone" type="button">Done</button></span></div>
      <div class="selrow acts"><button class="btn" id="selAlbum" type="button">New album</button><button class="btn" id="selExport" type="button">Export</button><button class="btn" id="selRemove" type="button">Remove</button></div>
    </div>
    <button class="fab left" id="add" type="button" aria-label="Add photos"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </section>

  <button class="fab" id="fab" type="button" aria-label="Color settings" hidden>
    <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/><circle cx="8" cy="6" r="2.4"/><circle cx="16" cy="12" r="2.4"/><circle cx="10" cy="18" r="2.4"/></svg>
  </button>

  <section id="detail" hidden>
    <header class="bar">
      <button class="icon" id="dClose" type="button" aria-label="Back to photos"><svg viewBox="0 0 24 24"><path d="M20 12H5M11 5l-7 7 7 7"/></svg></button>
      <div class="dhead"><b id="dTitle"></b><a id="dLoc" target="_blank" rel="noopener" hidden></a></div>
      <button class="icon" id="dDel" type="button" aria-label="Remove photo"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5"/></svg></button>
    </header>
    <div class="stage" id="stage"><img id="dImg" alt=""><canvas id="dCanvas" hidden></canvas><i id="dMark" hidden></i></div>
    <div class="dbody">
      <div class="dtop" id="dTop">
        <div class="seg" id="dMode">
          <button type="button" data-mode="match">Match</button><button type="button" data-mode="photo">Photo</button>
        </div>
        <button class="info" type="button" aria-label="About the match view" aria-expanded="false" data-tip="In Match, pixels inside your tolerances stay in color and everything else is dithered.">i</button>
      </div>
      <div class="stats" id="dStats"></div>
      <div>
        <p class="cap">Main colors in this photo <button class="info" type="button" aria-label="About main colors" aria-expanded="false" data-tip="Tap a color here, or tap anywhere on the photo, to search the album for it.">i</button></p>
        <div class="pal" id="dPal"></div>
      </div>
    </div>
  </section>

  <aside id="sheet" class="closed" aria-label="Color settings">
    <div class="titlebar">
      <span class="chip0"></span><b id="sheetName">No color picked</b><button class="other" id="swapColor" type="button" hidden></button><span class="stripes"></span>
      <button class="icon" id="sheetClose" type="button" aria-label="Close settings"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="sheet-body">
      <div class="group">
        <h4>Color</h4>
        <div class="row"><label for="cH">Hue</label><input type="range" id="cH" min="0" max="360" step="1"><output id="oH" for="cH"></output><button class="rst" type="button" data-reset="cH" aria-label="Reset hue to default"><svg viewBox="0 0 24 24"><path d="M5.6 15.5A7.5 7.5 0 1 0 5 9.2"/><path d="M2.2 6.6 5 9.6l3.1-2.7"/></svg></button></div>
        <div class="row"><label for="cC">Saturation</label><input type="range" id="cC" min="0" max="100" step="1"><output id="oC" for="cC"></output><button class="rst" type="button" data-reset="cC" aria-label="Reset saturation to default"><svg viewBox="0 0 24 24"><path d="M5.6 15.5A7.5 7.5 0 1 0 5 9.2"/><path d="M2.2 6.6 5 9.6l3.1-2.7"/></svg></button></div>
        <div class="row"><label for="cL">Luminance</label><input type="range" id="cL" min="5" max="98" step="1"><output id="oL" for="cL"></output><button class="rst" type="button" data-reset="cL" aria-label="Reset luminance to default"><svg viewBox="0 0 24 24"><path d="M5.6 15.5A7.5 7.5 0 1 0 5 9.2"/><path d="M2.2 6.6 5 9.6l3.1-2.7"/></svg></button></div>
      </div>
      <div class="group">
        <h4>Tolerance <button class="info" type="button" aria-label="About tolerance" aria-expanded="false" data-tip="How far a pixel can drift from your color and still count.">i</button></h4>
        <div class="row"><label for="tH">Hue</label><input type="range" id="tH" min="4" max="90" step="1"><output id="otH" for="tH"></output><button class="rst" type="button" data-reset="tH" aria-label="Reset hue tolerance to default"><svg viewBox="0 0 24 24"><path d="M5.6 15.5A7.5 7.5 0 1 0 5 9.2"/><path d="M2.2 6.6 5 9.6l3.1-2.7"/></svg></button></div>
        <div class="row"><label for="tC">Saturation</label><input type="range" id="tC" min="2" max="80" step="1"><output id="otC" for="tC"></output><button class="rst" type="button" data-reset="tC" aria-label="Reset saturation tolerance to default"><svg viewBox="0 0 24 24"><path d="M5.6 15.5A7.5 7.5 0 1 0 5 9.2"/><path d="M2.2 6.6 5 9.6l3.1-2.7"/></svg></button></div>
        <div class="row"><label for="tL">Luminance</label><input type="range" id="tL" min="3" max="60" step="1"><output id="otL" for="tL"></output><button class="rst" type="button" data-reset="tL" aria-label="Reset luminance tolerance to default"><svg viewBox="0 0 24 24"><path d="M5.6 15.5A7.5 7.5 0 1 0 5 9.2"/><path d="M2.2 6.6 5 9.6l3.1-2.7"/></svg></button></div>
      </div>
      <div class="group">
        <h4>Coverage <button class="info" type="button" aria-label="About coverage" aria-expanded="false" data-tip="How much of the photo has the color. Tap an amount to include or leave out photos with that much.">i</button></h4>
        <div class="chips" id="bands"></div>
      </div>
      <div class="group checkrow">
        <label class="check" for="balance"><input type="checkbox" id="balance"><span>Balance warm lighting</span></label>
        <button class="info" type="button" aria-label="About balancing warm lighting" aria-expanded="false" data-tip="Cancels each photo's warm color cast before matching, so a white plate under yellow light still counts as white.">i</button>
      </div>
      <div class="group">
        <h4>Saved colors <button class="info" type="button" aria-label="About saved colors" aria-expanded="false" data-tip="Save a color with its tolerances and it shows up at the end of the color row, marked with a small dot.">i</button></h4>
        <div class="presets" id="presets"></div>
        <div style="margin-top:8px"><button class="btn" id="savePreset" type="button">Save this color</button></div>
      </div>
    </div>
  </aside>

  <div id="menu" hidden></div>
  <div id="tip" role="tooltip" hidden></div>
  <div id="toast" role="status" hidden></div>
  <div id="dialog" hidden></div>
  <input type="file" id="file" accept="image/*" multiple hidden>
</div>
<script src="engine.js"></script>
<script>const SAMPLES = "samples/samples.json";</script>
<script src="app.js"></script>
</body>
</html>
